# Quality profiles for Radarr and Sonarr, from the TRaSH Guides templates (hd-bluray-web, web-1080p) with these changes:
# - x265 (HD) scored 0 instead of -10000, so HEVC 1080p releases are allowed.
# - Radarr: 1080p only (the template also allows Bluray-720p).
# - Sonarr "Language Profiles" group left out, so non-English releases are allowed.
# - DTS audio and Dolby Vision without HDR fallback: -10000 (rejected; many TVs cannot decode them).
# - HDR: -100 (SDR preferred; HDR is still accepted when nothing else exists).
# - Size caps to keep the media folder small, in MB per minute of runtime:
#   movies max 66 (8 GB for 2 h), preferred 35 (4.2 GB); Bluray min lowered from 50.8 to 17 (2 GB) so smaller encodes qualify.
#   episodes max 50 (2.2 GB for 45 min), preferred 30 (1.3 GB).
# Applied by homecider apply (Recyclarr runs once per apply).
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
      qualities:
        - {name: Bluray-1080p, min: 17, preferred: 35, max: 66}
        - {name: WEBDL-1080p, preferred: 35, max: 66}
        - {name: WEBRip-1080p, preferred: 35, max: 66}
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
    custom_format_groups:
      add:
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
    custom_formats:
      - trash_ids:
          - 1c1a4c5e823891c75bc50380a6866f73  # DTS
          - 2f22d89048b01681dde8afe203bf2e95  # DTS X
          - f9f847ac70a0af62ea4a08280b859636  # DTS-ES
          - 8e109e50e0a0b83a5098b056e13bf6db  # DTS-HD HRA
          - dcf3ec6938fa32445f590a4da84256cd  # DTS-HD MA
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
            score: -10000
      - trash_ids:
          - 493b6d1dbec3c3364c59d7607f7e3405  # HDR
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
            score: -100
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
            score: 0

sonarr:
  shows:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
      qualities:
        - {name: WEBDL-1080p, preferred: 30, max: 50}
        - {name: WEBRip-1080p, preferred: 30, max: 50}
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
    custom_formats:
      - trash_ids:
          - 5964f2a8b3be407d083498e4459d05d0  # DTS
          - 9d00418ba386a083fbf4d58235fc37ef  # DTS X
          - c1a25cd67b5d2e08287c957b1eb903ec  # DTS-ES
          - cfa5fbd8f02a86fc55d8d223d06a5e1f  # DTS-HD HRA
          - c429417a57ea8c41d57e6990a8b0033f  # DTS-HD MA
          - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback)
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: -10000
      - trash_ids:
          - 505d871304820ba7106b693be6fe4a9e  # HDR
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: -100
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 0
