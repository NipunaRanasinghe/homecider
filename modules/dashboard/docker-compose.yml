# dashboard module (opt-in): Homepage on port 3000, generated by user.sh from the enabled modules.
# All values come from .env, written by user.sh. Images are pinned; change a version here, then run homecider apply.
# Homepage has no login: anyone who can open port 3000 (home network, your Tailscale devices) can view it.
# API keys stay in the generated config and are never sent to the browser.
name: homecider-dashboard

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - ${CONFIG_DIR}:/app/config
    ports:
      - 3000:3000
    depends_on:
      - socket-proxy
      - status
    restart: unless-stopped

  # Container status for Homepage. Only reads are allowed (POST=0), so Homepage cannot start, stop or create
  # containers. Not published on the Mac.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: homepage-socket-proxy
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Serves status.json (written by status.sh every 5 minutes) to Homepage. Not published on the Mac.
  status:
    image: busybox:1.37
    container_name: homepage-status
    user: ${PUID}:${PGID}
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ${STATUS_DIR}:/www:ro
    restart: unless-stopped
