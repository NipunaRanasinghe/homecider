<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="HomeCider architecture: devices on the home network reach an Apple Silicon Mac that runs Jellyfin, Immich, an optional dashboard and an optional download chain; backups, alerts and downloads are the only outgoing connections.">
