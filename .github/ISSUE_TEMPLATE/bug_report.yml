name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste** `secrets.env`, `.env` files, API keys, passwords, your ntfy topic or VPN keys.
        Security problems: use "Report a vulnerability" under the Security tab instead of an issue.
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: Mac mini M2, MacBook Air M1, ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version (sw_vers -productVersion)
    validations:
      required: true
  - type: input
    id: modules
    attributes:
      label: MODULES and any non-default settings from homecider.env
      description: Leave out paths or values you consider private.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of bin/homecider doctor and bin/homecider status
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The failing command's output and logs from ~/Library/Logs/homecider/
      render: text
