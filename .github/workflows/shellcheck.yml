name: shellcheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Warnings and errors fail the build; info-level style notes (e.g. the deliberate A && B || C) do not.
      - run: shellcheck -s sh -S warning bin/homecider lib/common.sh modules/*/*.sh modules/*/module.env
  bats:
    # lib/common.sh reads the user's home folder with dscl, so the tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install bats-core
      - run: bats tests
