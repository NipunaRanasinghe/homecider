name: shellcheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Warnings and errors fail the build; info-level style notes (e.g. the deliberate A && B || C) do not.
      - run: shellcheck -s sh -S warning bin/homecider lib/common.sh modules/*/*.sh
